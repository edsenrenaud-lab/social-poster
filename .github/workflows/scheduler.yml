name: Social Media Scheduler

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run poster
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
          PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
        run: python scripts/poster.py

      - name: Commit updated schedule
        if: always()
        run: |
          git config user.name "social-scheduler-bot"
          git config user.email "actions@github.com"
          git add schedule.json
          git diff --cached --quiet && exit 0

          git commit -m "Update post statuses [skip ci]"

          # The remote can move between this run's checkout and this push
          # (another run finishing, or a manual push landing at the same
          # moment). On rejection: save this run's actual schedule.json
          # result, reset cleanly onto the latest remote commit, then
          # reapply this run's result on top and push again. This avoids
          # git merge/rebase conflict markers ever touching the JSON file.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/3) — reapplying this run's result onto the latest remote state..."
            cp schedule.json /tmp/schedule_this_run.json
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/schedule_this_run.json schedule.json
            git add schedule.json
            git diff --cached --quiet && exit 0
            git commit -m "Update post statuses [skip ci]"
          done

          echo "Push still failing after 3 attempts — giving up this run."
          exit 1

      - name: Notify on failure
        if: failure()
        run: |
          curl -H "Title: TCWA Social Poster — post failed" \
               -d "One or more posts failed this run. Check schedule.json on GitHub for the error, or view: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
               "ntfy.sh/${{ secrets.NTFY_TOPIC }}"